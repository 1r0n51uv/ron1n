# Stack di esempio per un'app ron1n pubblicata su GHCR. Copia in
# infra/<app>/, sostituisci <app> e aggiungi il blocco in proxy/Caddyfile.
name: <app>

services:
  app:
    image: ghcr.io/1r0n51uv/<app>:main   # rollback: :sha-<commit>
    restart: unless-stopped
    env_file: .env
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - proxy

networks:
  proxy:
    external: true
