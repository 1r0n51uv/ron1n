# Reverse proxy per tutti i servizi web del server.
name: proxy

services:
  caddy:
    # Costruita in locale da Dockerfile: Caddy più il plugin Cloudflare.
    image: ron1n/caddy:2.10.2-cloudflare-0.2.4
    build: .
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO in infra/proxy/.env}
      CF_API_TOKEN: ${CF_API_TOKEN:?manca CF_API_TOKEN in infra/proxy/.env}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3, che Caddy annuncia.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Per raggiungere i servizi in rete host, come Glances.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
