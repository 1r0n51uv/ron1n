# Reverse proxy per tutti i servizi web del server. Riceve le richieste dal
# tunnel (infra/tunnel) sulla rete proxy: niente porte sull'host.
name: proxy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO in infra/proxy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Per raggiungere i servizi in rete host, come Glances.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
