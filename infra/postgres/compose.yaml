# Postgres condiviso dalle app ron1n: ogni app ha il suo database e il suo
# utente (oggi ron1nos). Nessuna porta sull'host: le app lo raggiungono come
# postgres:5432 sulla rete esterna db.
name: postgres

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Al primo avvio (volume vuoto) crea utenti e database delle app.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db

volumes:
  postgres_data:

networks:
  db:
    external: true
