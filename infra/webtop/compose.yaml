# Webtop: desktop Linux completo (Debian + XFCE, Firefox, terminale, file
# manager) aperto dal browser. Il server resta senza interfaccia grafica: il
# desktop vive solo in questo container. Passa da Caddy sulla rete proxy,
# nessuna porta sull'host.
name: webtop

services:
  webtop:
    image: lscr.io/linuxserver/webtop:debian-xfce-a5b8a138-ls218
    restart: unless-stopped
    env_file: .env
    # Firefox e Chromium usano molto la memoria condivisa: con i 64 MB di
    # default le schede si chiudono da sole.
    shm_size: "1gb"
    volumes:
      # Home dell'utente (/config): impostazioni, segnalibri, download.
      - webtop_config:/config
    networks:
      - proxy

volumes:
  webtop_config:

networks:
  proxy:
    external: true
