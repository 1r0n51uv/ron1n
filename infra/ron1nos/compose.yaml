# Dashboard ron1nOS: un solo container Node che serve la SPA e l'API
# /api/v1 sulla porta 8080, pubblicato da Caddy su home.ron1n.space (solo
# tailnet). Parla con qBittorrent sulla rete proxy e con Postgres
# (infra/postgres) sulla rete db. Il servizio si chiama
# ron1nos, non app: sulla rete proxy il nome deve essere unico.
name: ron1nos

services:
  ron1nos:
    image: ghcr.io/1r0n51uv/ron1nos:main # rollback: :sha-<commit>
    restart: unless-stopped
    env_file: .env
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # Per i servizi in rete host, come Glances (modulo Server).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Copia del catalogo delle immagini degli esercizi (modulo Allenamento):
    # si scarica al primo avvio e resta fra un aggiornamento e l'altro.
    # Si può riscaricare in ogni momento, quindi niente backup.
    volumes:
      - workout-catalog:/data/workout-catalog
    networks:
      - proxy
      - db

volumes:
  workout-catalog:

networks:
  proxy:
    external: true
  db:
    external: true
