# Configurazione di Glances (formato ini). Riferimento completo:
# https://github.com/nicolargo/glances/blob/develop/conf/glances.conf

[global]
# Secondi tra due letture. La dashboard interroga ogni 5 s.
refresh=3
check_update=false
# Punti tenuti in memoria per lo storico breve (1200 × 3 s = 1 ora).
history_size=1200

[outputs]
# L'API non ha login: accetta solo gli Host di Caddy e del backend di
# ron1nOS (protezione dal DNS rebinding) e nessuna origine cross-site.
webui_allowed_hosts=glances.home.ron1n.space,host.docker.internal,172.17.0.1
cors_origins=https://glances.home.ron1n.space
# Niente server MCP.
enable_mcp=false

[network]
# Solo le interfacce fisiche: niente loopback, bridge e veth di Docker,
# interfaccia di Tailscale.
hide=lo,docker.*,br-.*,veth.*,tailscale.*,ifb.*

[fs]
# File montati da Docker nel container (hostname, resolv.conf…) e
# partizioni di sistema.
hide=/etc/.*,/boot.*,/snap.*

[diskio]
hide=loop.*,/dev/loop.*

[containers]
disable=False
